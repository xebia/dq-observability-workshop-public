# Lab 3: Soda Checks — Fill in the Blanks
# =========================================================
# Your task: write checks that cover freshness, volume,
# and distribution (3 of the 5 observability pillars).
#
# Run from the repo root:
#   uv run soda scan -d workshop \
#     -c labs/lab3_soda/configuration.yml \
#     labs/lab3_soda/checks_template.yml
#
# After checks pass: deliberately break one.
# Delete 3 rows from seeds/raw_orders.csv,
# then run: uv run dbt seed && uv run dbt run, then scan again.
# =========================================================

checks for main.orders:

  # VOLUME PILLAR
  # The orders table should have between 10 and 1000 rows.
  - row_count between ___ and ___:
      name: "orders table has expected row count"

  # FRESHNESS PILLAR
  # The newest order is always ~2 days old (dates are shifted
  # at load time so the data never goes stale).
  # Set a threshold in days that the current data would pass.
  - freshness(created_at) < ___d:
      name: "orders data is not stale"

  # DISTRIBUTION PILLAR
  # Order amounts should be between 0 and 1000.
  # (There is one row that breaks this — your check should catch it.)
  - invalid_count(amount) = 0:
      valid min: ___
      valid max: ___
      name: "order amounts within expected range"

  # UNIQUENESS (you already know this one from Lab 1)
  - duplicate_count(order_id) = ___:
      name: "no duplicate order IDs"
