# Lab 3 Solution — Soda Checks
#
# Run from repo root:
#   uv run soda scan -d workshop \
#     -c labs/lab3_soda/configuration.yml \
#     solutions/lab3_soda/checks.yml
#
# Expected results on the unmodified dataset:
#   PASS  orders table has expected row count   (12 rows, between 10 and 1000)
#   PASS  orders data is not stale              (newest order is 2 days old — dates
#                                                are shifted at load time in stg_orders)
#   FAIL  order amounts within expected range   (row 11 has amount 9999.00, outside 0–1000)
#   FAIL  no duplicate order IDs               (order_id 3 appears twice)
#
# After deleting 3 rows from seeds/raw_orders.csv and rebuilding,
# "orders table has expected row count" also FAILS (9 < 10) — that's
# the volume pillar catching silent data loss.

checks for main.orders:

  - row_count between 10 and 1000:
      name: "orders table has expected row count"

  - freshness(created_at) < 7d:
      name: "orders data is not stale"

  - invalid_count(amount) = 0:
      valid min: 0
      valid max: 1000
      name: "order amounts within expected range"

  - duplicate_count(order_id) = 0:
      name: "no duplicate order IDs"
